[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "creditengine"
version = "0.2.0"
description = "Merton-approach, multi-year stochastic credit risk model for an insurer's general account"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Siavash Feizi" }]
keywords = ["credit risk", "Merton", "Vasicek", "Gaussian copula", "rating migration", "Monte Carlo", "NAIC RBC", "insurance"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "statsmodels>=0.14",
    "scikit-learn>=1.4",
    "numba>=0.59",
    "duckdb>=1.0",
    "pyarrow>=15.0",
    "requests>=2.31",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
data = ["fredapi>=0.5", "yfinance>=0.2.40", "lxml>=5.1", "python-dotenv>=1.0"]
ml = ["shap>=0.45"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "mypy>=1.9", "pre-commit>=3.7", "nbstripout>=0.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: long-running Monte Carlo tests",
    "integration: end-to-end pipeline tests",
    "data: tests that need downloaded raw data",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "NPY"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
